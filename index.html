<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>心愛老婆專用即時到站查詢</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{--red:#e31836;--ink:#1e293b}
*{box-sizing:border-box}
body{margin:0;background:#f4f6f8;color:#333;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",sans-serif}
.app{max-width:480px;min-height:100vh;margin:auto;background:#fff;box-shadow:0 0 15px #00000012}
header{position:sticky;top:0;z-index:10;padding:14px 16px;background:#2d3748;color:#fff;box-shadow:0 2px 5px #0002}
header.kmb{background:var(--red)}
header.love{background:linear-gradient(135deg, #b8860b, #d4af37, #aa771c)}
.head{display:flex;gap:12px;align-items:center}
.title{font-size:1.1rem;font-weight:700;line-height:1.3}
.sub{font-size:.85rem;opacity:.9;margin-top:2px}
.back{display:none;border:0;background:none;color:#fff;font-size:1.4rem;cursor:pointer}
.panel{display:none;padding:16px}
.panel.active{display:block}
.option,.primary{width:100%;border-radius:8px;padding:12px 14px;font-weight:700;font-size:.95rem;cursor:pointer}
.option{background:#fff;border:2px solid #e2e8f0;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;color:#000}
.shortcut-blue{background:#dbeafe;border-color:#1e3a8a}
.shortcut-yellow{background:#fef3c7;border-color:#92400e}
.shortcut-gap{margin-top:22px}
.shortcut-text{min-width:0;flex:1;line-height:1.45}
.home-eta{display:block;margin-top:3px;font-size:.8rem;font-weight:600;color:#172554;line-height:1.4}
.shortcut-yellow .home-eta{color:#713f12}
.home-eta.multi{font-size:clamp(.58rem,2.7vw,.8rem);line-height:1.45}
.home-eta.multi .eta-line{display:block;white-space:nowrap;max-width:100%;letter-spacing:-.01em}
.primary{background:var(--red);border:0;color:#fff;margin-top:10px;transition:all 0.3s ease;position:relative;overflow:hidden}
.tag{font-size:.75rem;padding:3px 6px;border-radius:4px;color:#fff;background:var(--red);white-space:nowrap}
.timeline{position:relative;margin:8px 0 0 24px}
.timeline:before{content:"";position:absolute;left:-17px;top:15px;bottom:25px;width:3px;background:#e2e8f0}
.stop{position:relative;border:1px solid #e2e8f0;border-radius:8px;margin-bottom:12px;transition:all .2s ease}
.stop.target-selected{border:2px solid var(--red)!important;box-shadow:0 3px 10px rgba(227,24,54,0.2)}
.stop.target-selected .stop-head{background:#fff0f2;color:var(--red);font-weight:800}
.stop.target-selected .dot{border-color:var(--red)!important;background:var(--red)!important}
.dot{position:absolute;left:-29px;top:16px;width:12px;height:12px;border:3px solid #718096;border-radius:50%;background:#fff;transition:all .2s ease}
.stop-head{padding:12px 16px;font-weight:700;display:flex;justify-content:space-between;cursor:pointer;border-radius:7px}
.detail{display:none;padding:12px;background:#f8fafc;border-top:1px solid #e2e8f0}
.stop.expanded .detail{display:block}
.eta{background:#fff;border:1px solid #e2e8f0;border-radius:6px;padding:10px}
.eta.target{border:2px solid var(--red);background:#fffdfd}
.eta-title{display:flex;justify-content:space-between;gap:8px;color:#777;font-size:.85rem;font-weight:700;margin-bottom:6px}
.badge{background:#374151;color:#fff;padding:7px 10px;border-radius:8px;font-size:.9rem;line-height:1.15;text-align:center;white-space:nowrap}
.etas{display:flex;gap:8px;justify-content:space-between}
.pill{flex:1;background:#edf2f7;padding:6px;border-radius:4px;text-align:center}
.time{font-size:.95rem;font-weight:700}
.wait{font-size:.75rem;color:#777}
.route-label{font-size:1rem;font-weight:800;color:var(--ink);margin:2px 2px 7px}
.custom{background:#f1f5f9;border:2px solid #475569;border-radius:10px;padding:14px;margin-bottom:16px;box-shadow:0 2px 8px #0000000a}
.custom-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.custom-title{font-size:1rem;font-weight:700;line-height:1.35;color:var(--ink)}
.custom-pills{display:flex;gap:8px;flex-wrap:wrap}
.custom-pill{flex:1 1 calc(33.333% - 6px);min-width:90px;background:#e2e8f0;border-radius:6px;padding:10px 4px;text-align:center}
.custom-time{font-size:1.05rem;font-weight:700;color:#0f172a;line-height:1.2}
.custom-wait{font-size:.78rem;color:#475569;margin-top:4px;font-weight:500}
.meta{text-align:center;color:#777;font-size:.85rem;margin-top:8px}
#load{position:fixed;inset:0;z-index:50;background:#0009;color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center}
.spin{width:48px;height:48px;border:5px solid #fff;border-bottom-color:var(--red);border-radius:50%;animation:r 1s linear infinite;margin-bottom:14px}
@keyframes r{to{transform:rotate(360deg)}}

/* 金色反光按鈕樣式 (Easter Egg 1227) */
.btn-gold{
  background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%) !important;
  color: #3d2200 !important;
  font-weight: 800 !important;
  text-shadow: 0 1px 1px rgba(255, 255, 255, 0.8);
  box-shadow: 0 4px 15px rgba(212, 175, 55, 0.5), 0 0 10px rgba(255, 223, 0, 0.4);
  border: 1px solid #ffe87c !important;
  transform: scale(1.02);
}
.btn-gold::after{
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: linear-gradient(
    60deg,
    transparent 30%,
    rgba(255, 255, 255, 0.8) 50%,
    transparent 70%
  );
  transform: rotate(30deg);
  animation: goldShine 2s infinite;
}
@keyframes goldShine{
  0%{ transform: translateX(-100%) rotate(30deg); }
  100%{ transform: translateX(100%) rotate(30deg); }
}

/* 幸福快車專頁樣式 */
.love-card {
  background: linear-gradient(135deg, #fff5f7 0%, #ffffff 100%);
  border: 2px solid #fecdd3;
  border-radius: 16px;
  padding: 24px 20px;
  box-shadow: 0 10px 25px -5px rgba(244, 63, 94, 0.15);
}
.love-days-highlight {
  background: linear-gradient(135deg, #e11d48, #be123c);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  font-weight: 900;
}
</style>
</head>
<body>
<main class="app">
  <header id="header">
    <div class="head">
      <button id="back" class="back" onclick="goBack()">←</button>
      <div>
        <div id="headMain" class="title">心愛老婆專用即時到站查詢</div>
        <div id="headSub" class="sub" style="display:none"></div>
      </div>
    </div>
  </header>

  <section id="step2" class="panel active">
    <h2 class="text-lg font-bold mb-3">輸入路線號碼</h2>
    <input id="route" class="w-full rounded-lg border-2 border-slate-300 p-3 text-lg uppercase outline-none focus:border-slate-600" placeholder="例如：73X, 71A, 74X, 271" oninput="checkEasterEgg()" onkeydown="if(event.key==='Enter')searchRoute()">
    <button id="searchBtn" class="primary" onclick="searchRoute()">查詢九巴和龍運巴士路線</button>
    <div class="mt-4 text-sm font-bold text-slate-500 mb-2">常用快捷路線</div>
    <button class="option shortcut-blue" onclick="quick71()"><span class="shortcut-text">⚡ 71A：往 大埔墟站<span id="p71" class="home-eta">正在讀取最近兩班…</span></span><span>→</span></button>
    <button class="option shortcut-blue" onclick="quick74()"><span class="shortcut-text">⚡ 74X：往 觀塘碼頭<span id="p74" class="home-eta">正在讀取最近兩班…</span></span><span>→</span></button>
    <button class="option shortcut-blue" onclick="quick3m5()"><span class="shortcut-text">⚡ 3M/5：往 真鐸學校<span id="p3m5" class="home-eta multi">正在讀取最近兩班…</span></span><span>→</span></button>
    <button class="option shortcut-yellow shortcut-gap" onclick="quick74Return()"><span class="shortcut-text">⚡ 74X/74B：往 大埔中心<span id="p74r" class="home-eta multi">正在讀取最近兩班…</span></span><span>→</span></button>
    <button class="option shortcut-yellow" onclick="quick271()"><span class="shortcut-text">⚡ 271：往 富亨總站<span id="p271" class="home-eta">正在讀取最近兩班…</span></span><span>→</span></button>
  </section>

  <section id="step3" class="panel">
    <h2 class="text-lg font-bold mb-3">請選擇行駛方向與班次</h2>
    <div id="bounds"></div>
  </section>

  <section id="step4" class="panel">
    <h2 class="text-lg font-bold mb-3">請點擊車站查看實時到站時間</h2>
    <div id="stops" class="timeline"></div>
    <div id="updated" class="meta">--</div>
  </section>

  <section id="step5" class="panel">
    <div id="specialCards"></div>
    <div id="specialUpdated" class="meta">--</div>
  </section>

  <!-- 幸福快車專用頁面 (Step 6) -->
  <section id="step6" class="panel">
    <div class="love-card text-center space-y-4">
      <div class="text-3xl">💖 幸福快車資訊 💖</div>
      <div id="loveContent" class="text-left text-slate-800 space-y-4 text-base font-semibold leading-relaxed pt-2">
        <!-- 內容由 JS 動態生成 -->
      </div>
    </div>
  </section>
</main>

<div id="load">
  <div class="spin"></div>
  <div id="loadText">正在讀取數據...</div>
</div>

<script>
const API='https://data.etabus.gov.hk/v1/transport/kmb',$=id=>document.getElementById(id);
let step=2,routeItem,stops=[],timer=null,routeCache=null,routeCacheAt=0,homeBusy=false,currentSelectedStop=null;

function loading(on,msg='正在讀取數據...'){$('load').style.display=on?'flex':'none';$('loadText').textContent=msg}

async function get(url){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),9000);
  try{
    const r=await fetch(url,{signal:c.signal});
    if(!r.ok)throw Error('網絡連線失敗');
    return await r.json();
  }finally{clearTimeout(t)}
}

async function allRoutes(){
  if(routeCache&&Date.now()-routeCacheAt<60000)return routeCache;
  routeCache=(await get(API+'/route/')).data||[];
  routeCacheAt=Date.now();
  return routeCache;
}

function setStep(n){
  step=n;
  [2,3,4,5,6].forEach(i=>{
    const el=$('step'+i);
    if(el) el.classList.toggle('active',i===n);
  });
  $('back').style.display=n>2?'block':'none';
  $('header').classList.toggle('kmb',n===4||n===5);
  $('header').classList.toggle('love',n===6);
  
  if(n===2){
    $('headMain').textContent='心愛老婆專用即時到站查詢';
    $('headSub').style.display='none';
    refreshHomeEtas();
  }
  if(n!==4&&n!==5){
    clearInterval(timer);
    timer=null;
    currentSelectedStop=null;
  }
}

function goBack(){
  setStep((step===5||step===6)?2:step-1);
}

function format(t){return new Date(t).toLocaleTimeString('zh-HK',{hour:'2-digit',minute:'2-digit',hour12:true})}
function mins(t){return Math.max(0,Math.round((new Date(t)-Date.now())/60000))}
function stamp(){$('specialUpdated').textContent='最後更新時間：'+new Date().toLocaleTimeString()}
function upcoming(a){return a.filter(x=>x&&x.eta&&new Date(x.eta)>new Date()).sort((x,y)=>new Date(x.eta)-new Date(y.eta))}
function etaText(e){return `${format(e.eta)}（尚餘${mins(e.eta)}分鐘）`}
function twoText(a){let x=upcoming(a).slice(0,2);return x.length?x.map(etaText).join('；'):'暫無即時班次'}
function line(label,a){let x=upcoming(a).slice(0,2);return `<span class="eta-line">${label}：${x.length?x.map(etaText).join('；'):'暫無即時班次'}</span>`}

/* 檢查彩蛋 (輸入 1227) */
function checkEasterEgg(){
  const val=$('route').value.trim();
  const btn=$('searchBtn');
  if(val==='1227'){
    btn.classList.add('btn-gold');
    btn.textContent='幸福快車查詢';
  }else{
    btn.classList.remove('btn-gold');
    btn.textContent='查詢九巴和龍運巴士路線';
  }
}

/* 計算相愛時間天數與年月號 (含第1天包容性計算：+1天) */
function calcLoveStats(){
  const start=new Date(2014, 11, 27); // 2014年12月27日 (月份0-indexed)
  const now=new Date();
  
  // 計算相距總天數 (包含當天，故 +1)
  const diffMs=now.getTime()-start.getTime();
  const totalDays=Math.floor(diffMs/(1000*60*60*24)) + 1;
  
  // 計算 年、月、日
  let y=now.getFullYear()-start.getFullYear();
  let m=now.getMonth()-start.getMonth();
  let d=now.getDate()-start.getDate();
  
  if(d<0){
    m--;
    // 上一個月的天數
    const prevMonthLastDay=new Date(now.getFullYear(), now.getMonth(), 0).getDate();
    d+=prevMonthLastDay;
  }
  if(m<0){
    y--;
    m+=12;
  }
  
  return { totalDays, y, m, d };
}

/* 觸發幸福快車頁面 */
function openLoveExpress(){
  const stats=calcLoveStats();
  $('headMain').textContent='幸福快車專用查詢';
  $('headSub').textContent='心愛老婆 ding3ding1 專屬';
  $('headSub').style.display='block';
  
  const contentEl=$('loveContent');
  contentEl.innerHTML=`
    <p class="text-lg font-bold text-rose-600 border-b border-rose-100 pb-2">心愛的ding3ding1：</p>
    <p class="py-1">你已跟心愛老公相愛了 <span class="text-2xl love-days-highlight">${stats.totalDays}</span> 天<br>
    <span class="text-sm font-semibold text-rose-500">［即相愛 ${stats.y} 年 ${stats.m} 月 ${stats.d} 日］</span></p>
    <p class="py-1 text-slate-700">如想了解更多，請立即打電話給老公！</p>
    <p class="text-right text-rose-600 font-bold pt-2">心愛老公上。</p>
  `;
  
  setStep(6);
}

async function routeEta(stop,route,service,orig,dest){
  try{
    let all=await allRoutes(),v=all.find(x=>x.route===route&&String(x.service_type)===String(service)&&x.orig_tc.includes(orig)&&x.dest_tc.includes(dest));
    if(!v)return[];
    let d=(await get(`${API}/eta/${stop}/${route}/${service}`)).data||[];
    return d.filter(x=>x.eta&&x.dir===v.bound);
  }catch(e){return[]}
}

async function eta74(){
  try{
    let all=(await allRoutes()).filter(x=>x.route==='74X'&&x.bound==='O'),v=all.find(x=>x.service_type==='1')||all[0];
    if(!v)return[];
    let rs=(await get(`${API}/route-stop/74X/outbound/${v.service_type}`)).data||[],s=rs.find(x=>+x.seq===5);
    if(!s)return[];
    let d=(await get(`${API}/eta/${s.stop}/74X/${v.service_type}`)).data||[];
    return d.filter(x=>x.eta&&x.dir==='O');
  }catch(e){return[]}
}

async function eta271(){
  try{
    let all=(await allRoutes()).filter(x=>x.route==='271'&&x.dest_tc.includes('富亨')),v=all.find(x=>x.service_type==='1')||all[0];
    if(!v)return[];
    let dir=v.bound==='O'?'outbound':'inbound';
    let rs=(await get(`${API}/route-stop/271/${dir}/${v.service_type}`)).data||[],s=rs.find(x=>+x.seq===21)||rs[0];
    if(!s)return[];
    let d=(await get(`${API}/eta/${s.stop}/271/${v.service_type}`)).data||[];
    return d.filter(x=>x.eta&&x.dir===v.bound);
  }catch(e){return[]}
}

async function refreshHomeEtas(){
  if(step!==2||homeBusy)return;
  homeBusy=true;
  try{
    let[a,b,c,e,f,g,h]=await Promise.all([
      routeEta('EDDFFB9424A5582C','71A','1','富亨','大埔墟'),
      eta74(),
      routeEta('7FB952821E3FCAD2','3M','1','彩雲','慈雲山(北)'),
      routeEta('87825C8E4FE99CD8','5','1','尖沙咀碼頭','富山邨'),
      routeEta('E89B2315750AB2FD','74X','1','觀塘碼頭','大埔中心'),
      routeEta('E89B2315750AB2FD','74B','1','九龍灣','大埔中心'),
      eta271()
    ]);
    if(step!==2)return;
    $('p71').textContent=twoText(a);
    $('p74').textContent=twoText(b);
    $('p3m5').innerHTML=line('3M',c)+line('5',e);
    $('p74r').innerHTML=line('74X',f)+line('74B',g);
    $('p271').textContent=twoText(h);
  }catch(e){
    ['p71','p74','p3m5','p74r','p271'].forEach(id=>$(id).textContent='暫未能讀取');
  }finally{homeBusy=false}
}

async function searchRoute(){
  let r=$('route').value.trim().toUpperCase();
  if(!r)return alert('請輸入路線號碼！');
  
  /* 彩蛋判斷：當輸入為 1227 時進入幸福快車頁面 */
  if(r==='1227'){
    openLoveExpress();
    return;
  }

  loading(true,`正在查詢路線 ${r}...`);
  try{
    let d=(await allRoutes()).filter(x=>x.route===r).map(x=>({
      route:x.route,
      bound:x.bound==='O'?'outbound':'inbound',
      service:x.service_type,
      orig:x.orig_tc,
      dest:x.dest_tc,
      desc:x.service_type==='1'?'常規班次':'特別班次 '+x.service_type
    }));
    if(!d.length)throw Error('找不到相關路線');
    $('bounds').innerHTML='';
    d.forEach(x=>{
      let b=document.createElement('button');
      b.className='option';
      b.innerHTML=`<span><b class="tag">九巴／龍運</b>　${x.desc}：${x.orig} 往 ${x.dest}</span><span>→</span>`;
      b.onclick=()=>choose(x);
      $('bounds').appendChild(b);
    });
    setStep(3);
  }catch(e){
    alert(e.message||'查詢網絡失敗，請重試！');
  }finally{loading(false)}
}

function startSpecial(main,sub,loader){
  setStep(5);
  $('headMain').textContent=main;
  $('headSub').textContent=sub;
  $('headSub').style.display='block';
  loader();
  clearInterval(timer);
  timer=setInterval(loader,15000);
}

function renderCards(cards){
  $('specialCards').innerHTML=cards.map(x=>`
    ${x.routeLabel?`<div class="route-label">${x.routeLabel}</div>`:''}
    <div class="custom">
      <div class="custom-head">
        <div class="custom-title">${x.label}</div>
        <span class="badge">本站預測</span>
      </div>
      <div class="custom-pills">
        ${upcoming(x.etas).length?upcoming(x.etas).map(e=>`
          <div class="custom-pill">
            <div class="custom-time">${format(e.eta)}</div>
            <div class="custom-wait">${mins(e.eta)}分鐘</div>
          </div>
        `).join(''):'<div class="w-full text-center py-3 text-slate-500">暫無即時到站班次數據</div>'}
      </div>
    </div>
  `).join('');
}

function quick71(){startSpecial('[九巴／龍運] 71A','富亨總站（TP991）往 大埔墟站',load71)}
async function load71(){
  loading(true,'正在讀取 71A 到站資料...');
  try{renderCards([{routeLabel:'71A大埔（富亨） 往 大埔墟站',label:'1. 富亨總站 (TP991)',etas:await routeEta('EDDFFB9424A5582C','71A','1','富亨','大埔墟')}])}
  finally{loading(false);stamp()}
}

function quick74(){startSpecial('[九巴／龍運] 74X','廣福邨（TP576）往 觀塘碼頭',load74)}
async function load74(){
  loading(true,'正在讀取 74X 到站資料...');
  try{renderCards([{label:'5. 廣福邨 (TP576)',etas:await eta74()}])}
  finally{loading(false);stamp()}
}

function quick3m5(){startSpecial('[九巴／龍運] 3M／5','真鐸學校相關車站即時到站預測',load3m5)}
async function load3m5(){
  loading(true,'正在讀取 3M／5 到站資料...');
  try{
    let[a,c]=await Promise.all([
      routeEta('7FB952821E3FCAD2','3M','1','彩雲','慈雲山(北)'),
      routeEta('87825C8E4FE99CD8','5','1','尖沙咀碼頭','富山邨')
    ]);
    renderCards([
      {routeLabel:'3M彩雲 往 慈雲山(北)',label:'4. 彩虹轉車站 - 彩虹總站 (WT995)',etas:a},
      {routeLabel:'5尖沙咀碼頭 往 富山邨',label:'18. 彩虹轉車站 - 碧海樓 (WT341)',etas:c}
    ]);
  }finally{loading(false);stamp()}
}

function quick74Return(){startSpecial('[九巴／龍運] 74X／74B','志蓮淨苑（WT132）往 大埔中心',load74Return)}
async function load74Return(){
  loading(true,'正在讀取 74X／74B 到站資料...');
  try{
    let[x,b]=await Promise.all([
      routeEta('E89B2315750AB2FD','74X','1','觀塘碼頭','大埔中心'),
      routeEta('E89B2315750AB2FD','74B','1','九龍灣','大埔中心')
    ]);
    renderCards([
      {routeLabel:'74X觀塘碼頭 往 大埔中心',label:'5. 志蓮淨苑 (WT132)',etas:x},
      {routeLabel:'74B九龍灣 往 大埔中心',label:'5. 志蓮淨苑 (WT132)',etas:b}
    ]);
  }finally{loading(false);stamp()}
}

function quick271(){startSpecial('[九巴／龍運] 271','廣福道轉車站（TP279）往 大埔(富亨)',load271)}
async function load271(){
  loading(true,'正在讀取 271 到站資料...');
  try{renderCards([{routeLabel:'271 高鐵(西九龍站) 往 大埔(富亨)',label:'21. 廣福道轉車站 (TP279)',etas:await eta271()}])}
  finally{loading(false);stamp()}
}

async function choose(x){
  routeItem=x;
  loading(true,'正在載入車站列表...');
  try{
    let rs=(await get(`${API}/route-stop/${x.route}/${x.bound}/${x.service}`)).data,
        ds=await Promise.all(rs.map(s=>get(`${API}/stop/${s.stop}`).catch(()=>({data:null}))));
    stops=rs.map((s,i)=>({seq:+s.seq,stop:s.stop,name:ds[i].data?.name_tc||'未知車站'}));
    currentSelectedStop=null;
    renderStops();
    $('headMain').textContent='[九巴／龍運] '+x.route;
    $('headSub').textContent=`${x.desc}：${x.orig} 往 ${x.dest}`;
    $('headSub').style.display='block';
    setStep(4);
  }catch(e){
    alert('載入車站失敗');
  }finally{loading(false)}
}

function renderStops(){
  $('stops').innerHTML=stops.map((s,i)=>`
    <div id="stop${i}" class="stop">
      <span class="dot"></span>
      <div class="stop-head" onclick="toggle(${i})">
        <span>${s.seq}. ${s.name}</span>
        <span id="arr${i}">▼</span>
      </div>
      <div class="detail" id="detail${i}">正在載入到站時間...</div>
    </div>
  `).join('');
}
