<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>香港巴士即時到站查詢</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { max-width: 600px; margin: 0 auto; padding: 20px; background-color: #f5f5f7; color: #1d1d1f; }
    h1 { font-size: 1.5rem; text-align: center; margin-bottom: 20px; }
    .search-box { display: flex; gap: 8px; margin-bottom: 20px; }
    select, input, button { padding: 12px; font-size: 1rem; border: 1px solid #ccc; border-radius: 8px; }
    input { flex: 1; text-transform: uppercase; }
    button { background-color: #0071e3; color: white; border: none; cursor: pointer; font-weight: 600; }
    button:hover { background-color: #0077ed; }
    .card { background: white; padding: 16px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 12px; }
    .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; color: white; margin-bottom: 8px; }
    .badge-CTB { background-color: #0055a5; }
    .badge-KMB { background-color: #e2001a; }
    .badge-NLB { background-color: #f39c12; }
    .error { color: #d70015; background: #ffe5e7; padding: 12px; border-radius: 8px; margin-bottom: 12px; }
    .eta-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; }
    .eta-item:last-child { border-bottom: none; }
  </style>
</head>
<body>

  <h1>香港巴士即時到站</h1>

  <div class="search-box">
    <select id="operatorSelect">
      <option value="CTB">城巴 (CTB)</option>
      <option value="KMB">九巴/龍運 (KMB)</option>
    </select>
    <input type="text" id="routeInput" placeholder="輸入路線 (如 A11, 720, A42)" />
    <button onclick="handleSearch()">查詢</button>
  </div>

  <div id="output"></div>

  <script>
    // 核心通用 API 請求 (含底層清洗與 422 靜默降級)
    async function apiFetch(operator, endpoint) {
      // 1. 底層洗淨：強制作大寫處理
      const cleanOp = operator.trim().toUpperCase();
      let url = '';

      if (cleanOp === 'CTB') {
        url = `https://data.etabus.gov.hk/v1/transport/citybus-nwfb/${endpoint}`;
      } else if (cleanOp === 'KMB') {
        url = `https://data.etabus.gov.hk/v1/transport/kmb/${endpoint}`;
      }

      try {
        const response = await fetch(url);
        
        // 2. 靜默降級：將 422 (Unprocessable) 及 404 視為「該機構無此路線」
        if (response.status === 422 || response.status === 404) {
          return { success: false, notFound: true };
        }
        
        if (!response.ok) {
          throw new Error(`HTTP Error ${response.status}`);
        }

        const resData = await response.json();
        return { success: true, data: resData.data };
      } catch (err) {
        return { success: false, error: err.message };
      }
    }

    // 多機構跨區自動連環掃描
    async function handleSearch() {
      const output = document.getElementById('output');
      const primaryOp = document.getElementById('operatorSelect').value;
      const rawRoute = document.getElementById('routeInput').value;

      // 輸入清洗
      const route = rawRoute.trim().toUpperCase();
      if (!route) {
        output.innerHTML = `<div class="error">請輸入路線號碼。</div>`;
        return;
      }

      output.innerHTML = `<div class="card">搜尋中...</div>`;

      // 查詢順序：先查使用者選擇的機構，若無資料則自動切換至另一個機構
      const scanOrder = primaryOp === 'CTB' ? ['CTB', 'KMB'] : ['KMB', 'CTB'];

      for (const op of scanOrder) {
        const result = await apiFetch(op, `route/${op}/${route}`);

        if (result.success && result.data) {
          renderRouteInfo(op, route, result.data);
          return; // 找到路線，中斷掃描
        }
      }

      // 若所有機構皆回傳 422 / 404
      output.innerHTML = `<div class="error">查無路線 ${route}，請確認號碼是否正確。</div>`;
    }

    // 渲染路線資訊與實時 ETA
    async function renderRouteInfo(operator, route, routeData) {
      const output = document.getElementById('output');
      
      output.innerHTML = `
        <div class="card">
          <span class="badge badge-${operator}">${operator === 'CTB' ? '城巴 CTB' : '九巴/龍運 KMB'}</span>
          <h2>路線 ${route}</h2>
          <p>起點：${routeData.orig_tc || routeData.orig_en} ➔ 終點：${routeData.dest_tc || routeData.dest_en}</p>
          <button onclick="loadETA('${operator}', '${route}')">讀取即時到站時間</button>
        </div>
        <div id="etaResult"></div>
      `;
    }

    // 讀取即時班次 (ETA)
    async function loadETA(operator, route) {
      const etaResult = document.getElementById('etaResult');
      etaResult.innerHTML = `<div class="card">載入班次中...</div>`;

      const result = await apiFetch(operator, `eta/${operator}/${route}/1`);

      if (!result.success || !result.data || result.data.length === 0) {
        etaResult.innerHTML = `<div class="card">目前暫無實時到站班次資料。</div>`;
        return;
      }

      // 提取前 3 班車時間
      const etaItems = result.data.slice(0, 3).map(item => {
        const time = item.eta ? new Date(item.eta).toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit' }) : '未定';
        const dest = item.dest_tc || item.dest_en || '目的地';
        const rmk = item.rmk_tc ? `(${item.rmk_tc})` : '';
        return `
          <div class="eta-item">
            <span>往 ${dest} ${rmk}</span>
            <strong>${time}</strong>
          </div>
        `;
      }).join('');

      etaResult.innerHTML = `<div class="card"><h3>即時班次</h3>${etaItems}</div>`;
    }
  </script>
</body>
</html>
